<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unitree 双狗控制台</title>
<link rel="stylesheet" href="/static/console.css">
</head>
<body>

<header class="bar">
  <div class="bar-left">
    <strong class="brand">Unitree 双狗控制台</strong>
    <span id="fleet-summary" class="muted">连接中…</span>
  </div>
  <div class="bar-right">
    <button id="btn-stop-all" class="btn btn-stop" title="停止所有机器狗">全部停止</button>
    <button id="btn-estop" class="btn btn-estop" title="急停：锁存并阻尼">急停</button>
    <button id="btn-estop-release" class="btn" disabled title="解除急停锁存">解除急停</button>
  </div>
</header>

<div id="estop-banner" class="banner hidden">
  <span id="estop-text">急停已锁存 —— 所有运动指令被拒绝</span>
</div>

<main id="pens" class="pens"></main>

<footer class="bar footer">
  <div class="bar-left">
    <label for="input-mode">输入目标</label>
    <select id="input-mode">
      <option value="focus">Focus — 驱动当前选中的狗</option>
      <option value="both">Both — 同时驱动两只</option>
      <option value="split">Split — 各用一组按键</option>
      <option value="per_source">Per-source — 按输入设备绑定</option>
    </select>
    <span id="mode-hint" class="muted"></span>
  </div>
  <div class="bar-right">
    <span id="gamepad" class="muted"></span>
    <span id="watching" class="muted"></span>
    <span id="link-state" class="muted">—</span>
  </div>
</footer>

<!-- Template is cloned per robot. All values are written with textContent,
     never innerHTML: a robot's name is operator-supplied and would otherwise
     be a stored-XSS vector, which is exactly what the previous web console
     shipped (an unescaped inline onclick built from the dog's name).

     Layout notes, because the shape is the design:
     * The pen is a two-column card, not a vertical list. On a wide screen a
       stacked column wasted most of the width and pushed every control below
       the fold.
     * The video and the drive pad share a row. The pad is the thing an
       operator touches most, so it sits beside the picture rather than under
       five other sections.
     * Telemetry is a single strip, not a three-column table with one number in
       each cell.
     * The control groups are tabs, not accordions: accordions hide everything
       and still cost a row each. -->
<template id="pen-template">
  <section class="pen" data-robot>

    <header class="pen-head">
      <button class="focus-btn" data-role="focus" title="选中这只狗（空格切换）">●</button>
      <span class="pen-name" data-role="name"></span>
      <span class="pen-role muted" data-role="role"></span>
      <button class="fault-badge hidden" data-role="fault-badge" title="有故障，见「感知」页">
        <span data-role="fault-count">0</span>
      </button>
      <span class="spacer"></span>
      <span class="pill" data-role="link">—</span>
    </header>

    <div class="pen-actions">
      <button class="btn" data-role="link-toggle">连接</button>
      <button class="btn" data-role="stop">停止</button>
      <button class="btn btn-estop-sm" data-role="estop">急停</button>
      <button class="btn" data-role="video-toggle">画面</button>
    </div>

    <div class="stage">
      <div class="video-wrap">
        <img class="video" data-role="video" alt="实时画面">
        <div class="video-off" data-role="video-off">画面已关闭</div>
      </div>

      <div class="drive">
        <div class="pad-grid" data-role="pad">
          <button class="pad-key" data-axis="ly+" title="前进 (W)">↑</button>
          <button class="pad-key" data-axis="rx-" title="左转 (Q)">⟲</button>
          <button class="pad-key" data-axis="rx+" title="右转 (E)">⟳</button>
          <button class="pad-key" data-axis="ly-" title="后退 (S)">↓</button>
          <button class="pad-key" data-axis="lx-" title="左移 (A)">←</button>
          <button class="pad-key" data-axis="lx+" title="右移 (D)">→</button>
        </div>
        <p class="hint" data-role="keys"></p>
      </div>
    </div>

    <div class="strip">
      <div class="gauge" data-role="battery-wrap">
        <span class="gauge-label">电量</span>
        <span class="gauge-bar"><i data-role="battery-bar"></i></span>
        <span class="gauge-value" data-role="battery">—</span>
      </div>
      <div class="flags" data-role="flags"></div>
      <span class="strip-target muted" data-role="target" title="连接目标"></span>
    </div>

    <dl class="facts hidden">
      <div><dt>状态</dt><dd data-role="state">—</dd></div>
    </dl>

    <nav class="tabs" data-role="tabs"></nav>
    <div class="panels" data-role="panels"></div>

    <!-- Kept out of the tab panels: a fault is the one thing that has to be
         visible whichever tab is open, so the head carries a badge and the
         list lives under 感知. -->
    <div class="faults hidden" data-role="faults-wrap">
      <ul class="fault-list" data-role="faults"></ul>
    </div>

    <details class="audit" data-role="audit-wrap">
      <summary>最近操作 <span class="muted" data-role="audit-count"></span></summary>
      <ul class="audit-list" data-role="audit"></ul>
    </details>

    <div class="controls hidden" data-role="controls"></div>
  </section>
</template>

<script src="/static/gamepad.js"></script>
<script src="/static/console.js"></script>
</body>
</html>
