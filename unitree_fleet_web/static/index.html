<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unitree 双狗控制台</title>
<link rel="stylesheet" href="/static/console.css">
</head>
<body>

<header class="bar">
  <div class="bar-left">
    <strong class="brand">Unitree 双狗控制台</strong>
    <span id="fleet-summary" class="muted">连接中…</span>
  </div>
  <div class="bar-right">
    <button id="btn-stop-all" class="btn btn-stop" title="停止所有机器狗">全部停止</button>
    <button id="btn-estop" class="btn btn-estop" title="急停：锁存并阻尼">急停</button>
    <button id="btn-estop-release" class="btn" disabled title="解除急停锁存">解除急停</button>
  </div>
</header>

<div id="estop-banner" class="banner hidden">
  <span id="estop-text">急停已锁存 —— 所有运动指令被拒绝</span>
</div>

<!-- The second of the two things this console is for. Driving is per-dog by
     nature; "make them both dance" is a single intent with no per-dog form,
     and clicking two buttons a second apart is not the same as together.
     Given its own band above the pens, not a tab inside one of them. -->
<section id="fleet-bar" class="fleet-bar">
  <div class="fleet-bar-head">
    <span class="fleet-bar-title">一起做动作</span>
    <span id="fleet-targets" class="muted"></span>
    <span class="spacer"></span>
    <span id="fleet-result" class="fleet-result"></span>
    <button id="fleet-repeat" class="btn hidden" title="再执行一次">再来一次</button>
  </div>
  <div id="fleet-posture" class="fleet-row"></div>
  <div id="fleet-named" class="fleet-row"></div>

  <!-- Sequences: the one control that keeps issuing commands after the
       operator has taken their hands off the keyboard, so its progress and its
       stop button are always on screen while it runs. -->
  <div class="fleet-row routines" id="fleet-routines"></div>

  <!-- The arena, seen from above. Only useful with a camera and a calibration,
       so it says which of those is missing rather than drawing an empty field —
       an empty field and two dogs out of shot look identical otherwise. -->
  <details class="arena" id="arena-panel">
    <summary>
      场地视图
      <span class="flag" id="arena-state">未配置</span>
      <span class="muted" id="arena-detail"></span>
    </summary>
    <div class="arena-body">
      <svg id="arena-map" class="arena-map" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="arena-legend muted" id="arena-legend"></div>
    </div>

    <!-- Formation. The map says how far apart they are; this is where the
         operator says how far apart they should be, and watches it happen. -->
    <div class="formation" id="formation">
      <span class="row-label">编队</span>
      <label class="calib-size">
        目标间距 <input id="form-distance" type="number" value="1.0" min="0" max="10" step="0.1"> 米
      </label>
      <label class="calib-size">
        方位 <input id="form-bearing" type="number" value="0" min="-180" max="180" step="15"> °
      </label>
      <label class="calib-size">
        朝向差 <input id="form-spread" type="number" value="0" min="-180" max="180" step="15"> °
      </label>
      <select id="form-mover" class="ctl-select" title="谁动">
        <option value="both">两只一起挪</option>
        <option value="b">只动 dog2</option>
      </select>
      <span class="spacer"></span>
      <span id="form-status" class="muted"></span>
      <button id="form-start" class="btn">对齐</button>
      <button id="form-stop" class="btn btn-quiet hidden">停下</button>
      <div class="form-steps" id="form-steps"></div>
    </div>

    <!-- Calibration. The four points have to be given in the arena's own order,
         which is why the button numbers them as they are clicked and why the
         printed plan numbers them too — four correct points in the wrong order
         produce a mirrored arena that looks plausible. -->
    <div class="calib" id="calib">
      <div class="calib-head">
        <button id="calib-start" class="btn">标定场地</button>
        <span id="calib-hint" class="muted">对着画面依次点四个角，顺序和打印的标定图一致</span>
        <span class="spacer"></span>
        <button id="calib-save" class="btn" disabled>保存标定</button>
        <button id="calib-cancel" class="btn btn-quiet hidden">取消</button>
      </div>
      <div class="calib-body hidden" id="calib-body">
        <div class="calib-photo">
          <img id="calib-image" alt="相机画面">
          <svg id="calib-overlay" class="calib-overlay"></svg>
        </div>
        <div class="calib-side">
          <label class="calib-size">
            场地宽度 <input id="calib-width" type="number" value="4" min="0.5" max="30" step="0.5"> 米
            　深度 <input id="calib-depth" type="number" value="4" min="0.5" max="30" step="0.5"> 米
          </label>
          <label class="calib-size">
            标记离地 <input id="calib-tag-height" type="number" value="35" min="0" max="150" step="1"> cm
            　相机高度 <input id="calib-camera-height" type="number" value="250" min="0" max="800" step="10"> cm
          </label>
          <p class="muted calib-note" id="calib-note">
            标定靶放在<strong>狗背高度</strong>时两个高度都填 0，误差从构造上就是 0；
            放在地上量则如实填写，控制台会把偏差算出来并标在数字旁边。
          </p>
          <ol class="calib-points" id="calib-points"></ol>
        </div>
      </div>
    </div>
  </details>

  <!-- Two dogs, one intent. `robot_turn(-90)` is closed loop on each robot's
       own gyro, so two dogs end a turn at different headings and the error
       accumulates over a sequence. This says how far apart they have got, and
       gives the operator the one thing the console cannot guess: the moment
       they were lined up. -->
  <div class="fleet-row sync-row" id="fleet-sync">
    <span class="row-label">同步</span>
    <span class="flag" id="sync-state">未标定</span>
    <span class="sync-detail muted" id="sync-detail"></span>
    <span class="spacer"></span>
    <button id="sync-mark" class="btn" title="以两只狗当前的位置和朝向为基准，之后所有偏差都相对此刻">标记对齐</button>
    <button id="sync-clear" class="btn btn-quiet" title="清除基准">清除</button>
  </div>

  <!-- The editor. A routine is a document, so it should be authorable from the
       page rather than only by editing Python — which is exactly why the
       branch this idea came from never had anyone author one. -->
  <details class="editor" id="editor">
    <summary>编排编辑器 <span class="muted" data-role="editor-count"></span></summary>
    <div class="editor-body">
      <div class="palette-wrap">
        <div class="editor-label">点一下加进序列</div>
        <div class="palette" id="editor-palette"></div>
      </div>
      <div class="steps-wrap">
        <div class="editor-label">
          序列
          <span class="muted" id="editor-empty">（空 —— 从左边点几个动作）</span>
        </div>
        <ol class="editor-steps" id="editor-steps"></ol>
      </div>
    </div>
    <div class="editor-foot">
      <input id="editor-name" class="editor-name" placeholder="编排名称，例如 一起鞠躬" maxlength="48">
      <label class="editor-opt">
        <input type="checkbox" id="editor-loop"> 循环
      </label>
      <span class="spacer"></span>
      <span id="editor-status" class="muted"></span>
      <button id="editor-clear" class="btn">清空</button>
      <button id="editor-save" class="btn">保存</button>
      <button id="editor-run" class="btn">保存并运行</button>
    </div>
  </details>
  <div id="routine-run" class="routine-run hidden">
    <div class="routine-head">
      <span class="routine-bar"><i data-role="routine-progress"></i></span>
      <span id="routine-label" class="routine-label"></span>
      <span class="spacer"></span>
      <span id="routine-pending" class="muted"></span>
      <button id="routine-stop" class="btn btn-estop-sm">停止编排</button>
    </div>
    <!-- The whole sequence, not a progress bar. A timeline you cannot see
         ahead of the playhead is a log with a label on it. -->
    <ol id="routine-timeline" class="timeline"></ol>
  </div>
</section>

<main id="pens" class="pens"></main>

<footer class="bar footer">
  <div class="bar-left">
    <label for="input-mode">输入目标</label>
    <select id="input-mode">
      <option value="focus">Focus — 驱动当前选中的狗</option>
      <option value="both">Both — 同时驱动两只</option>
      <option value="split">Split — 各用一组按键</option>
      <option value="per_source">Per-source — 按输入设备绑定</option>
    </select>
    <span id="mode-hint" class="muted"></span>
  </div>
  <div class="bar-right">
    <label for="trim" class="trim-label" title="缩放所有摇杆输出。第一次驱动一只真狗时把它调低。">速度</label>
    <input id="trim" type="range" min="10" max="100" step="5" value="100">
    <output id="trim-value" class="trim-value">100%</output>
    <span id="gamepad" class="muted"></span>
    <span id="watching" class="muted"></span>
    <span id="link-state" class="muted">—</span>
  </div>
</footer>

<!-- Template is cloned per robot. All values are written with textContent,
     never innerHTML: a robot's name is operator-supplied and would otherwise
     be a stored-XSS vector, which is exactly what the previous web console
     shipped (an unescaped inline onclick built from the dog's name).

     Layout notes, because the shape is the design:
     * The pen is a two-column card, not a vertical list. On a wide screen a
       stacked column wasted most of the width and pushed every control below
       the fold.
     * The video and the drive pad share a row. The pad is the thing an
       operator touches most, so it sits beside the picture rather than under
       five other sections.
     * Telemetry is a single strip, not a three-column table with one number in
       each cell.
     * The control groups are tabs, not accordions: accordions hide everything
       and still cost a row each. -->
<template id="pen-template">
  <section class="pen" data-robot>

    <header class="pen-head">
      <button class="focus-btn" data-role="focus" title="选中这只狗（空格切换）">●</button>
      <span class="pen-name" data-role="name"></span>
      <span class="pen-role muted" data-role="role"></span>
      <button class="fault-badge hidden" data-role="fault-badge" title="有故障，见「感知」页">
        <span data-role="fault-count">0</span>
      </button>
      <span class="spacer"></span>
      <span class="pill" data-role="link">—</span>
    </header>

    <div class="pen-actions">
      <button class="btn" data-role="link-toggle">连接</button>
      <button class="btn" data-role="stop">停止</button>
      <button class="btn btn-estop-sm" data-role="estop">急停</button>
      <button class="btn" data-role="video-toggle">画面</button>
    </div>

    <div class="stage">
      <div class="video-wrap">
        <img class="video" data-role="video" alt="实时画面">
        <div class="video-off" data-role="video-off">画面已关闭</div>
      </div>

      <!-- A joystick, not an arrow pad. Six buttons are six binary inputs for
           what is two continuous axes: you cannot hold "half forward", and a
           diagonal costs two simultaneous presses. Dragging a stick is the
           same gesture as the gamepad it mirrors, and the same axes WASD/QE
           drive — the keyboard stays the primary input and this shows what it
           is doing.

           Two controls because there are two axes: translation and rotation.
           Horizontal on the turn track is yaw; there is no second axis to
           give it. -->
      <div class="drive">
        <div class="joy" data-role="stick-move" title="平移 —— 拖动，或用 WASD">
          <span class="joy-ring"></span>
          <i class="joy-knob" data-role="knob-move"></i>
          <span class="joy-tag">平移</span>
        </div>
        <div class="turn-track" data-role="stick-turn" title="转向 —— 拖动，或用 QE">
          <i class="turn-knob" data-role="knob-turn"></i>
          <span class="joy-tag">转向</span>
        </div>
        <p class="hint" data-role="keys"></p>
      </div>
    </div>

    <div class="strip">
      <div class="gauge" data-role="battery-wrap">
        <span class="gauge-label">电量</span>
        <span class="gauge-bar"><i data-role="battery-bar"></i></span>
        <span class="gauge-value" data-role="battery">—</span>
      </div>
      <span class="flag" data-role="drive">空闲</span>
      <span class="flag hidden" data-role="where" title="相对本机里程计原点"></span>
      <div class="flags" data-role="flags"></div>
      <span class="strip-target muted" data-role="target" title="连接目标"></span>
    </div>

    <!-- The live body. Everything here rides on the three topics measured
         arriving on real hardware, so it is populated on the dog and not only
         under the mock: attitude (is it tipping?), foot contact (which feet are
         down?), and actual speed against what was commanded (is a stick held at
         full doing nothing?). -->
    <div class="body-strip" data-role="body-strip">
      <span class="bubble" data-role="bubble" title="姿态">
        <i data-role="bubble-dot"></i>
      </span>
      <span class="feet" data-role="feet" title="足端受力"></span>
      <span class="speed" data-role="speed"></span>
      <span class="muted gait" data-role="gait"></span>
    </div>

    <dl class="facts hidden">
      <div><dt>状态</dt><dd data-role="state">—</dd></div>
    </dl>

    <!-- Lives here rather than being created by the JS: an element the script
         reaches for should exist in the page, or its absence depends on which
         function happened to run first. `renderControls` moves it into 感知,
         which is the tab an operator opens when something is not showing. -->
    <div class="sources" data-role="sources"></div>

    <nav class="tabs" data-role="tabs"></nav>
    <div class="panels" data-role="panels"></div>

    <!-- Kept out of the tab panels: a fault is the one thing that has to be
         visible whichever tab is open, so the head carries a badge and the
         list lives under 感知. -->
    <div class="faults hidden" data-role="faults-wrap">
      <ul class="fault-list" data-role="faults"></ul>
    </div>

    <details class="audit" data-role="audit-wrap">
      <summary>最近操作 <span class="muted" data-role="audit-count"></span></summary>
      <ul class="audit-list" data-role="audit"></ul>
    </details>

    <div class="controls hidden" data-role="controls"></div>
  </section>
</template>

<script src="/static/gamepad.js"></script>
<script src="/static/console.js"></script>
</body>
</html>
