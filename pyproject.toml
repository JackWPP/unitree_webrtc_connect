[project]
name = "unitree_webrtc_connect"
version = "2.2.0"
description = "Connect to the Unitree Go2 and G1 with WebRTC"
readme = "README.md"
# `>=3.10` is what aiortc actually needs; the previous `>=3.8` was a claim the
# dependency tree never honoured (aiortc >= 1.15 requires 3.10+, and the
# pinned versions below are what this project is tested against).
requires-python = ">=3.10"
authors = [
    { name = "legion1581", email = "legion1581@gmail.com" }
]

# Core only. The heavy / platform-specific pieces that the humanoids never
# touch (LiDAR decoding, audio I/O, AudioHub transcoding) live in the extras
# below, and the corresponding imports moved to first-use inside the package.
dependencies = [
    # Upper-bounded on purpose. `unitree_webrtc_connect/__init__.py` monkey
    # patches aiortc internals and only branches on `== 1.10.0` and
    # `>= 1.11.0`, so a 2.x release would be patched by guesswork. Anything
    # below 1.15.0 is also untested by this fork.
    "aiortc>=1.9.0,<2",
    "pycryptodome",
    "requests",
    "curl_cffi",
    "packaging",
]

[project.optional-dependencies]
# Go2 LiDAR point-cloud decoding. libvoxel (default) needs wasmtime; the
# alternative native decoder needs lz4 + numpy.
go2 = [
    "numpy",
    "lz4",
    "wasmtime",
]
# Go2 audio playback/recording (the examples open the sound card themselves).
audio = [
    "numpy",
    "sounddevice",
]
# Go2 AudioHub file management — mp3 → wav conversion.
audiohub = [
    "pydub",
]
# Agent-facing MCP server (unitree-robot-mcp) + Skill support.
agent = [
    "mcp>=2.0",
]
# Dual-dog web console (unitree-fleet-console). Starlette already arrives with
# the `agent` extra's `mcp`; it is named explicitly so the console can be
# installed on its own.
console = [
    "starlette>=0.37",
    "uvicorn>=0.27",
]
# Everything the bundled examples import (OpenCV windows, Flask LiDAR
# plotter, sound card, MP3 conversion).
examples = [
    "numpy",
    "opencv-python",
    "sounddevice",
    "pyaudio",
    "pydub",
    "flask",
    "flask-socketio",
]
dev = [
    "pytest",
    "pytest-asyncio",
    # Starlette's TestClient needs httpx; tests only.
    "httpx",
]
# Convenience union of every optional group above.
all = [
    "numpy",
    "lz4",
    "wasmtime",
    "sounddevice",
    "pydub",
    "opencv-python",
    "pyaudio",
    "flask",
    "flask-socketio",
    "mcp>=2.0",
    "starlette>=0.37",
    "uvicorn>=0.27",
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[project.scripts]
unitree-fetch-aes-key = "unitree_webrtc_connect._cli:main"
unitree-robot-mcp = "unitree_robot_agent.cli:main"
unitree-fleet-console = "unitree_fleet_web.cli:main"

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "unitree_webrtc_connect*",
    "unitree_robot_agent*",
    "unitree_fleet_web*",
]
exclude = [
    "tests",
    "tests.*",
    "docs",
    "docs.*",
    "examples",
    "examples.*",
    "__pycache__",
    "__pycache__.*",
    "*.egg-info",
    "*.egg-info.*",
]

[tool.setuptools]
# include data files as listed in MANIFEST.in
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
