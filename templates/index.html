<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双机器狗控制中心</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- 自定义CSS -->
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <!-- 顶部导航栏 -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <i class="fas fa-robot me-2"></i>
                    双机器狗控制中心 v2.0
                </a>
                <div class="navbar-nav ms-auto">
                    <span class="navbar-text" id="connectionStatus">
                        <i class="fas fa-circle text-warning"></i> 正在连接...
                    </span>
                </div>
            </div>
        </nav>

        <!-- 主要内容区域 -->
        <div class="row">
            <!-- 左侧：连接管理 -->
            <div class="col-md-4">
                <!-- 网络扫描器 -->
                <div class="card mb-3">
                    <div class="card-header">
                        <h5><i class="fas fa-search me-2"></i>网络设备扫描</h5>
                    </div>
                    <div class="card-body">
                        <div class="d-grid gap-2 mb-3">
                            <button class="btn btn-info" id="scanDevicesBtn">
                                <i class="fas fa-wifi me-2"></i>扫描网络中Unitree设备
                            </button>
                        </div>
                        
                        <!-- 扫描结果显示 -->
                        <div id="scanResults" style="display: none;">
                            <h6>扫描结果:</h6>
                            <div id="scanResultsList" class="border rounded p-2" style="max-height: 200px; overflow-y: auto;">
                                <!-- 动态填充 -->
                            </div>
                            <div class="mt-2">
                                <button class="btn btn-sm btn-success" id="addSelectedDevicesBtn" disabled>
                                    <i class="fas fa-plus me-1"></i>添加选中设备
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 机器狗状态卡片 -->
                <div class="card mb-3">
                    <div class="card-header">
                        <h5><i class="fas fa-wifi me-2"></i>机器狗连接状态</h5>
                    </div>
                    <div class="card-body">
                        <div id="dogStatusList">
                            <!-- 动态加载机器狗状态 -->
                        </div>
                        
                        <!-- 连接控制按钮 -->
                        <div class="d-grid gap-2 mt-3">
                            <button class="btn btn-success" id="connectAllBtn">
                                <i class="fas fa-plug me-2"></i>连接所有机器狗
                            </button>
                            <button class="btn btn-danger" id="disconnectAllBtn">
                                <i class="fas fa-unlink me-2"></i>断开所有连接
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 机器狗管理 -->
                <div class="card mb-3">
                    <div class="card-header">
                        <h5><i class="fas fa-cog me-2"></i>机器狗管理</h5>
                    </div>
                    <div class="card-body">
                        <form id="addDogForm">
                            <div class="mb-2">
                                <input type="text" class="form-control" id="dogName" placeholder="机器狗名称" required>
                            </div>
                            <div class="mb-2">
                                <input type="text" class="form-control" id="dogIP" placeholder="IP地址" required>
                            </div>
                            <div class="mb-2">
                                <select class="form-select" id="connectionMethod">
                                    <option value="LocalSTA">本地STA模式</option>
                                    <option value="LocalAP">本地AP模式</option>
                                    <option value="Remote">远程模式</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary btn-sm">
                                <i class="fas fa-plus me-1"></i>添加机器狗
                            </button>
                        </form>
                    </div>
                </div>

                <!-- 控制模式选择 -->
                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-sliders-h me-2"></i>控制模式</h5>
                    </div>
                    <div class="card-body">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="controlMode" id="controlModeAll" value="all" checked>
                            <label class="form-check-label" for="controlModeAll">
                                同时控制所有机器狗
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="controlMode" id="controlModeSingle" value="single">
                            <label class="form-check-label" for="controlModeSingle">
                                单独控制
                            </label>
                        </div>
                        <div class="mt-2" id="dogSelectionDiv" style="display: none;">
                            <select class="form-select" id="selectedDog">
                                <option value="">选择机器狗</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧：控制面板 -->
            <div class="col-md-8">
                <!-- 系统状态 -->
                <div class="alert alert-info" role="alert">
                    <h6><i class="fas fa-info-circle me-2"></i>运动状态</h6>
                    <span id="movementStatus">系统就绪</span>
                </div>

                <!-- 摄像头显示面板 -->
                <div class="card mb-3">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="fas fa-video me-2"></i>实时摄像头</h5>
                        <div>
                            <select class="form-select form-select-sm me-2" id="cameraSelector" style="width: 150px; display: inline-block;">
                                <option value="">选择摄像头</option>
                            </select>
                            <button class="btn btn-sm btn-outline-success" id="startVideoBtn">
                                <i class="fas fa-play me-1"></i>开启摄像头
                            </button>
                            <button class="btn btn-sm btn-outline-danger" id="stopVideoBtn" style="display: none;">
                                <i class="fas fa-stop me-1"></i>关闭摄像头
                            </button>
                            <button class="btn btn-sm btn-outline-primary" id="startRecordBtn" style="display: none;">
                                <i class="fas fa-circle me-1"></i>开始录制
                            </button>
                            <button class="btn btn-sm btn-danger" id="stopRecordBtn" style="display: none;">
                                <i class="fas fa-stop-circle me-1"></i>停止录制
                            </button>
                        </div>
                    </div>
                    <div class="card-body text-center">
                        <div id="videoContainer" class="video-container" style="height: 400px; background-color: #000; border-radius: 8px; position: relative; display: flex; align-items: center; justify-content: center;">
                            <div id="videoPlaceholder" class="text-light">
                                <i class="fas fa-video-slash fa-3x mb-2"></i>
                                <div>请选择机器狗并启用摄像头</div>
                            </div>
                            <img id="videoElement" style="display: none; width: 100%; height: 100%; object-fit: contain;" alt="视频流">
                            <!-- 录制状态指示器 -->
                            <div id="recordingIndicator" class="position-absolute top-0 start-0 m-3" style="display: none;">
                                <span class="badge bg-danger">
                                    <i class="fas fa-circle me-1 blink"></i>
                                    录制中 <span id="recordingTime">00:00</span>
                                </span>
                            </div>
                        </div>
                        <div class="mt-2">
                            <small id="videoStatus" class="text-muted">摄像头未启动</small>
                            <span class="ms-3">
                                <small id="recordingStatus" class="text-muted"></small>
                            </span>
                        </div>
                    </div>
                </div>

                <!-- 日志显示面板 -->
                <div class="card mb-3">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="fas fa-list-alt me-2"></i>系统日志</h5>
                        <div>
                            <select class="form-select form-select-sm me-2" id="logLevelFilter" style="width: auto; display: inline-block;">
                                <option value="">所有日志</option>
                                <option value="ERROR">错误</option>
                                <option value="WARNING">警告</option>
                                <option value="INFO">信息</option>
                                <option value="DEBUG">调试</option>
                            </select>
                            <button class="btn btn-sm btn-outline-secondary" id="clearLogsBtn">
                                <i class="fas fa-trash me-1"></i>清空
                            </button>
                            <button class="btn btn-sm btn-outline-primary" id="refreshLogsBtn">
                                <i class="fas fa-sync me-1"></i>刷新
                            </button>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <div id="logDisplay" class="log-container" style="height: 200px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 0.85rem; background-color: #f8f9fa;">
                            <div class="p-2 text-muted text-center">系统启动中...</div>
                        </div>
                    </div>
                </div>

                <!-- 自动运动模式 -->
                <div class="card mb-3">
                    <div class="card-header">
                        <h5><i class="fas fa-running me-2"></i>自动运动模式</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="d-grid gap-2">
                                    <button class="btn btn-primary" id="startSquareWalkBtn">
                                        <i class="fas fa-square me-2"></i>开始正方形走路
                                    </button>
                                    <button class="btn btn-info" id="startDancePartyBtn">
                                        <i class="fas fa-music me-2"></i>开始舞蹈派对
                                    </button>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="d-grid gap-2">
                                    <button class="btn btn-warning" id="stopMovementBtn">
                                        <i class="fas fa-stop me-2"></i>停止自动运动
                                    </button>
                                    <button class="btn btn-danger" id="emergencyStopBtn">
                                        <i class="fas fa-exclamation-triangle me-2"></i>紧急停止
                                    </button>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 扑跃控制 -->
                        <hr>
                        <div class="row">
                            <div class="col-md-6">
                                <button class="btn btn-success" id="pounceOnceBtn">
                                    <i class="fas fa-arrow-up me-2"></i>扑跃一次
                                </button>
                            </div>
                            <div class="col-md-6">
                                <button class="btn btn-success" id="pounceTripleBtn">
                                    <i class="fas fa-arrow-up me-2"></i>扑跃三次
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 手动控制 -->
                <div class="card mb-3">
                    <div class="card-header">
                        <h5><i class="fas fa-gamepad me-2"></i>手动遥控</h5>
                    </div>
                    <div class="card-body">
                        <div class="text-center mb-3">
                            <button class="btn btn-outline-primary" id="enableManualBtn">
                                <i class="fas fa-hand-paper me-2"></i>启用手动控制
                            </button>
                        </div>
                        
                        <!-- 方向控制 -->
                        <div class="row justify-content-center">
                            <div class="col-auto">
                                <div class="row">
                                    <div class="col-12 text-center mb-2">
                                        <button class="btn btn-outline-secondary control-btn" data-direction="forward">
                                            <i class="fas fa-arrow-up"></i>
                                        </button>
                                    </div>
                                    <div class="col-4">
                                        <button class="btn btn-outline-secondary control-btn" data-direction="left">
                                            <i class="fas fa-arrow-left"></i>
                                        </button>
                                    </div>
                                    <div class="col-4 text-center">
                                        <button class="btn btn-outline-danger control-btn" data-direction="stop">
                                            <i class="fas fa-stop"></i>
                                        </button>
                                    </div>
                                    <div class="col-4">
                                        <button class="btn btn-outline-secondary control-btn" data-direction="right">
                                            <i class="fas fa-arrow-right"></i>
                                        </button>
                                    </div>
                                    <div class="col-12 text-center mt-2">
                                        <button class="btn btn-outline-secondary control-btn" data-direction="backward">
                                            <i class="fas fa-arrow-down"></i>
                                        </button>
                                    </div>
                                </div>
                                
                                <!-- 旋转控制 -->
                                <div class="row mt-3">
                                    <div class="col-6">
                                        <button class="btn btn-outline-info control-btn" data-direction="turn_left">
                                            <i class="fas fa-undo"></i> 左转
                                        </button>
                                    </div>
                                    <div class="col-6">
                                        <button class="btn btn-outline-info control-btn" data-direction="turn_right">
                                            <i class="fas fa-redo"></i> 右转
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 姿态控制 -->
                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-user-ninja me-2"></i>姿态控制</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <!-- 基础姿态 -->
                            <div class="col-md-6">
                                <h6>基础姿态</h6>
                                <div class="d-grid gap-2">
                                    <button class="btn btn-outline-primary action-btn" data-action="sit_down">
                                        <i class="fas fa-chair me-2"></i>坐下
                                    </button>
                                    <button class="btn btn-outline-primary action-btn" data-action="stand_up">
                                        <i class="fas fa-user me-2"></i>站立
                                    </button>
                                    <button class="btn btn-outline-primary action-btn" data-action="say_hello">
                                        <i class="fas fa-hand-wave me-2"></i>打招呼
                                    </button>
                                    <button class="btn btn-outline-primary action-btn" data-action="stretch">
                                        <i class="fas fa-expand-arrows-alt me-2"></i>伸展
                                    </button>
                                </div>
                            </div>
                            
                            <!-- 特技动作 -->
                            <div class="col-md-6">
                                <h6>特技动作</h6>
                                <div class="d-grid gap-2">
                                    <button class="btn btn-outline-success action-btn" data-action="wallow">
                                        <i class="fas fa-sync-alt me-2"></i>打滚
                                    </button>
                                    <button class="btn btn-outline-success action-btn" data-action="scrape">
                                        <i class="fas fa-paw me-2"></i>刨地
                                    </button>
                                    <button class="btn btn-outline-success action-btn" data-action="wiggle_hips">
                                        <i class="fas fa-heart me-2"></i>扭臀
                                    </button>
                                    <button class="btn btn-outline-success action-btn" data-action="finger_heart">
                                        <i class="fas fa-heart me-2"></i>比心
                                    </button>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 高难度动作 -->
                        <hr>
                        <h6>高难度动作</h6>
                        <div class="row">
                            <div class="col-md-3">
                                <button class="btn btn-outline-warning action-btn" data-action="handstand">
                                    <i class="fas fa-hand-paper me-2"></i>倒立
                                </button>
                            </div>
                            <div class="col-md-3">
                                <button class="btn btn-outline-warning action-btn" data-action="front_flip">
                                    <i class="fas fa-sync me-2"></i>前空翻
                                </button>
                            </div>
                            <div class="col-md-3">
                                <button class="btn btn-outline-warning action-btn" data-action="back_flip">
                                    <i class="fas fa-sync me-2"></i>后空翻
                                </button>
                            </div>
                            <div class="col-md-3">
                                <button class="btn btn-outline-warning action-btn" data-action="front_pounce">
                                    <i class="fas fa-arrow-up me-2"></i>扑跃
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 消息提示模态框 -->
    <div class="modal fade" id="messageModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="messageModalTitle">提示</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="messageModalBody">
                    <!-- 消息内容 -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <!-- 自定义JS -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
